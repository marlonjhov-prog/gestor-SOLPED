<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión SOLPED - SAP</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- PANTALLA DE LOGIN -->
  <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
    <div class="glass-card shadow-2xl rounded-2xl p-8 max-w-md w-full border border-slate-200">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl mb-3 shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-file-invoice text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900">Gestor SOLPED SAP</h2>
        <p class="text-slate-500 text-sm mt-1">Ingresa tu clave para acceder al panel</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña de Acceso</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3 top-3.5 text-slate-400"></i>
            <input type="password" id="passInput" placeholder="••••••••" required 
                   class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition">
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition shadow-lg shadow-blue-600/30">
          Iniciar Sesión
        </button>
      </form>
      <p id="loginError" class="text-red-500 text-xs text-center mt-3 hidden"></p>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="appScreen" class="hidden">
    
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="bg-blue-600 p-2 rounded-xl text-white">
            <i class="fa-solid fa-boxes-stacked text-lg"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-tight">Módulo SOLPED SAP</h1>
            <p class="text-xs text-slate-400">Registro de Solicitudes de Pedido</p>
          </div>
        </div>
        
        <div class="flex items-center gap-3">
          <button onclick="openClientModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 border border-slate-700 transition">
            <i class="fa-solid fa-users-gear text-blue-400"></i> Gestionar Clientes
          </button>
          <button onclick="handleLogout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition border border-red-500/30">
            <i class="fa-solid fa-right-from-bracket"></i> Salir
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
      
      <!-- Formulario -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
          <div class="flex items-center gap-2">
            <i id="formIcon" class="fa-solid fa-circle-plus text-blue-600 text-xl"></i>
            <h3 id="formTitle" class="text-lg font-bold text-slate-900">Registrar Nueva SOLPED</h3>
          </div>
          <button id="btnCancelEdit" onclick="resetSolpedForm()" class="hidden text-xs text-slate-500 hover:text-slate-700 bg-slate-100 px-3 py-1.5 rounded-lg">
            <i class="fa-solid fa-xmark"></i> Cancelar Edición
          </button>
        </div>

        <form id="solpedForm" onsubmit="handleSaveSolped(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          <input type="hidden" id="editSolpedId">

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">N° SOLPED SAP</label>
            <div class="relative">
              <i class="fa-solid fa-hashtag absolute left-3 top-3 text-slate-400 text-sm"></i>
              <input type="text" id="numSolped" placeholder="100029384" required
                     class="w-full pl-9 pr-3 py-2 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Fecha Emisión</label>
            <div class="relative">
              <i class="fa-regular fa-calendar absolute left-3 top-3 text-slate-400 text-sm"></i>
              <input type="date" id="fechaSolped" required
                     class="w-full pl-9 pr-3 py-2 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cliente</label>
            <div class="relative">
              <i class="fa-solid fa-building absolute left-3 top-3 text-slate-400 text-sm"></i>
              <select id="clienteSelect" required class="w-full pl-9 pr-3 py-2 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                <option value="">Cargando clientes...</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Adjunto PDF <span id="pdfOptionalText" class="text-slate-400 text-[10px] hidden">(Opcional al editar)</span></label>
            <input type="file" id="pdfInput" accept="application/pdf"
                   class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-slate-300 rounded-xl cursor-pointer">
          </div>

          <div class="md:col-span-2 lg:col-span-4 flex items-center justify-between pt-2">
            <span id="statusMsg" class="text-xs font-semibold"></span>
            <button type="submit" id="btnSubmit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-6 py-2.5 rounded-xl flex items-center gap-2 shadow-lg shadow-blue-600/20 transition">
              <i class="fa-solid fa-cloud-arrow-up"></i> <span id="btnSubmitText">Guardar Registro</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Tabla Histórico -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-list-check text-blue-600 text-xl"></i>
            <h3 class="text-lg font-bold text-slate-900">Histórico de SOLPEDs</h3>
          </div>

          <div class="flex items-center gap-3">
            <div class="relative w-full sm:w-64">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
              <input type="text" id="searchInput" oninput="filterDocuments()" placeholder="Buscar por N° o Cliente..."
                     class="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <!-- BOTÓN DE ACTUALIZAR FUNCIONAL -->
            <button id="btnRefresh" onclick="loadAllData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2.5 rounded-xl text-xs transition flex items-center justify-center border border-slate-300" title="Actualizar lista">
              <i id="refreshIcon" class="fa-solid fa-rotate"></i>
            </button>
          </div>
        </div>

        <div class="overflow-x-auto rounded-xl border border-slate-200">
          <table class="w-full text-left text-xs border-collapse">
            <thead class="bg-slate-50 text-slate-700 uppercase font-bold border-b border-slate-200">
              <tr>
                <th class="p-3">N° SOLPED</th>
                <th class="p-3">Fecha SOLPED</th>
                <th class="p-3">Cliente</th>
                <th class="p-3">Documento PDF</th>
                <th class="p-3 text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="solpedTable" class="divide-y divide-slate-100 text-slate-600"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- MODAL DE CLIENTES -->
  <div id="clientModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-users text-blue-600"></i> Administración de Clientes
        </h3>
        <button onclick="closeClientModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form onsubmit="handleSaveClient(event)" class="flex gap-2">
        <input type="hidden" id="modalClientId">
        <input type="text" id="modalClientName" placeholder="Nombre completo del cliente" required
               class="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">
          Guardar
        </button>
      </form>

      <div class="max-h-60 overflow-y-auto border border-slate-200 rounded-xl">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
              <th class="p-2.5">Cliente</th>
              <th class="p-2.5 text-right">Opciones</th>
            </tr>
          </thead>
          <tbody id="clientsTable" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzoAP1r1dM8EJRvLm1QiIJf1fpo5wh_lgkNFdlIVwyUZuEOsIZWV5ZeoLv0mZ4my8v7Q/exec";
    const ACCESS_PASSWORD = "1234";

    let allSolpeds = [];
    let allClients = [];

    window.onload = function() {
      sessionStorage.removeItem('authenticated');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('appScreen').classList.add('hidden');
    };

    function handleLogin(event) {
      event.preventDefault();
      if (document.getElementById('passInput').value === ACCESS_PASSWORD) {
        sessionStorage.setItem('authenticated', 'true');
        showAppScreen();
      } else {
        const err = document.getElementById('loginError');
        err.innerText = "Contraseña incorrecta";
        err.classList.remove('hidden');
      }
    }

    function showAppScreen() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      loadAllData();
    }

    function handleLogout() {
      sessionStorage.removeItem('authenticated');
      document.getElementById('appScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    async function loadAllData() {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('fa-spin');

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        allSolpeds = data.solpeds || [];
        allClients = data.clients || [];

        renderClientsSelect();
        renderClientsTable();
        renderSolpeds(allSolpeds);
      } catch (err) {
        console.error("Error al cargar datos:", err);
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
      }
    }

    async function handleSaveSolped(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const status = document.getElementById('statusMsg');
      const fileInput = document.getElementById('pdfInput');
      const editId = document.getElementById('editSolpedId').value;

      if (!editId && fileInput.files.length === 0) {
        alert("Por favor selecciona un archivo PDF.");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Guardando...`;
      status.className = "text-xs font-semibold text-blue-600";
      status.innerText = "Enviando datos a la base de datos...";

      const payload = {
        solpedId: editId,
        numSolped: document.getElementById('numSolped').value,
        fechaSolped: document.getElementById('fechaSolped').value,
        cliente: document.getElementById('clienteSelect').value
      };

      const executePost = async (dataObj) => {
        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(dataObj)
          });

          status.className = "text-xs font-semibold text-emerald-600";
          status.innerText = "¡SOLPED guardada correctamente!";
          resetSolpedForm();

          setTimeout(async () => {
            await loadAllData();
            status.innerText = "";
          }, 1000);

        } catch (err) {
          status.className = "text-xs font-semibold text-red-600";
          status.innerText = "Error de conexión al guardar.";
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span id="btnSubmitText">Guardar Registro</span>`;
        }
      };

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async function() {
          payload.fileName = file.name;
          payload.fileData = reader.result.split(',')[1];
          await executePost(payload);
        };
      } else {
        await executePost(payload);
      }
    }

    function editSolped(solped) {
      document.getElementById('editSolpedId').value = solped.id;
      document.getElementById('numSolped').value = solped.numSolped;
      document.getElementById('fechaSolped').value = solped.fechaSolped;
      document.getElementById('clienteSelect').value = solped.cliente;
      
      document.getElementById('formTitle').innerText = "Editar SOLPED #" + solped.numSolped;
      document.getElementById('btnSubmitText').innerText = "Actualizar SOLPED";
      document.getElementById('pdfOptionalText').classList.remove('hidden');
      document.getElementById('btnCancelEdit').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetSolpedForm() {
      document.getElementById('solpedForm').reset();
      document.getElementById('editSolpedId').value = '';
      document.getElementById('formTitle').innerText = "Registrar Nueva SOLPED";
      document.getElementById('btnSubmitText').innerText = "Guardar Registro";
      document.getElementById('pdfOptionalText').classList.add('hidden');
      document.getElementById('btnCancelEdit').classList.add('hidden');
    }

    async function deleteSolped(rowId, fileUrl) {
      if (!confirm("¿Deseas eliminar esta SOLPED y su archivo asociado?")) return;

      const payload = { action: 'deleteSolped', rowId: rowId, fileUrl: fileUrl };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        setTimeout(loadAllData, 1000);
      } catch (err) {
        alert("Error al intentar eliminar.");
      }
    }

    function renderClientsSelect() {
      const select = document.getElementById('clienteSelect');
      select.innerHTML = '<option value="">Selecciona un cliente...</option>';
      allClients.forEach(c => {
        select.innerHTML += `<option value="${c.nombre}">${c.nombre}</option>`;
      });
    }

    function renderClientsTable() {
      const tbody = document.getElementById('clientsTable');
      tbody.innerHTML = '';
      allClients.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td class="p-2.5 font-medium">${c.nombre}</td>
            <td class="p-2.5 text-right space-x-1">
              <button onclick="editClient('${c.id}', '${c.nombre}')" class="text-blue-600 hover:text-blue-800 px-1"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="deleteClient('${c.id}')" class="text-red-500 hover:text-red-700 px-1"><i class="fa-solid fa-trash-can"></i></button>
            </td>
          </tr>
        `;
      });
    }

    async function handleSaveClient(e) {
      e.preventDefault();
      const payload = {
        action: 'saveClient',
        clientId: document.getElementById('modalClientId').value,
        clientName: document.getElementById('modalClientName').value
      };

      await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      document.getElementById('modalClientId').value = '';
      document.getElementById('modalClientName').value = '';
      setTimeout(loadAllData, 1000);
    }

    function editClient(id, name) {
      document.getElementById('modalClientId').value = id;
      document.getElementById('modalClientName').value = name;
    }

    async function deleteClient(id) {
      if (!confirm("¿Eliminar este cliente?")) return;
      const payload = { action: 'deleteClient', clientId: id };

      await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      setTimeout(loadAllData, 1000);
    }

    function openClientModal() { document.getElementById('clientModal').classList.remove('hidden'); }
    function closeClientModal() { document.getElementById('clientModal').classList.add('hidden'); }

    function filterDocuments() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allSolpeds.filter(s => 
        (s.numSolped && s.numSolped.toString().toLowerCase().includes(q)) ||
        (s.cliente && s.cliente.toLowerCase().includes(q))
      );
      renderSolpeds(filtered);
    }

    function renderSolpeds(list) {
      const tbody = document.getElementById('solpedTable');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400">No hay registros cargados.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      list.forEach(s => {
        const solpedObj = JSON.stringify(s).replace(/"/g, '&quot;');
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-bold text-slate-800">
              <span class="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-lg border border-blue-200">#${s.numSolped}</span>
            </td>
            <td class="p-3 font-medium text-slate-600">${s.fechaSolped || 'N/A'}</td>
            <td class="p-3 font-semibold text-slate-700">${s.cliente}</td>
            <td class="p-3">
              <a href="${s.fileUrl}" target="_blank" class="text-blue-600 hover:text-blue-800 font-semibold inline-flex items-center gap-1">
                <i class="fa-solid fa-file-pdf text-red-500"></i> ${s.fileName}
              </a>
            </td>
            <td class="p-3 text-center space-x-1">
              <button onclick="editSolped(${solpedObj})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 p-2 rounded-xl transition" title="Editar SOLPED">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button onclick="deleteSolped('${s.id}', '${s.fileUrl}')" class="bg-red-50 hover:bg-red-100 text-red-600 p-2 rounded-xl transition" title="Eliminar SOLPED">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
